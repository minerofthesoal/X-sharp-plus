name: Build X# Toolchain

on:
  push:
    branches: [ main, develop, 'release/**', 'claude/**' ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libgtk-3-dev libgtksourceview-3.0-dev \
            libreadline-dev \
            ocl-icd-opencl-dev opencl-headers \
            libasound2-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev

      - name: Configure CMake (GCC)
        if: matrix.compiler == 'gcc'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=gcc \
            -DXS_ENABLE_GPU=ON \
            -DXS_ENABLE_IDE=ON \
            -DXS_BUILD_TESTS=ON

      - name: Configure CMake (Clang)
        if: matrix.compiler == 'clang'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=clang \
            -DXS_ENABLE_GPU=ON \
            -DXS_ENABLE_IDE=ON \
            -DXS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(nproc)

      - name: Run Tests
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure -j$(nproc)

      - name: Package
        if: matrix.compiler == 'gcc'
        run: |
          mkdir -p dist/xsharp
          cp build/xsharp dist/xsharp/
          cp -r stdlib dist/xsharp/
          cp -r examples dist/xsharp/
          cp README.md LICENSE dist/xsharp/
          tar -czf xsharp-linux-x64.tar.gz -C dist xsharp

      - name: Upload artifact
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: xsharp-linux-x64
          path: xsharp-linux-x64.tar.gz

  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake pkg-config gtk+3 gtksourceview3 readline

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DXS_ENABLE_GPU=ON \
            -DXS_ENABLE_IDE=ON \
            -DXS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

      - name: Run Tests
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Package
        run: |
          mkdir -p dist/xsharp
          cp build/xsharp dist/xsharp/
          cp -r stdlib dist/xsharp/
          cp -r examples dist/xsharp/
          cp README.md LICENSE dist/xsharp/
          tar -czf xsharp-macos-x64.tar.gz -C dist xsharp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xsharp-macos-x64
          path: xsharp-macos-x64.tar.gz

  build-vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm install

      - name: Compile
        working-directory: vscode-extension
        run: npm run compile

      - name: Package Extension
        working-directory: vscode-extension
        run: |
          npm install -g @vscode/vsce
          vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: xsharp-vscode-extension
          path: vscode-extension/*.vsix

  test-examples:
    name: Test Example Programs
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: xsharp-linux-x64

      - name: Extract
        run: tar -xzf xsharp-linux-x64.tar.gz

      - name: Run examples
        run: |
          for f in examples/*.xs; do
            echo "=== Running $f ==="
            ./xsharp/xsharp run "$f" || echo "WARN: $f exited with non-zero"
          done

  release:
    name: Create Release
    if: github.event_name == 'release'
    needs: [build-linux, build-macos, build-vscode-extension, test-examples]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: xsharp-linux-x64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: xsharp-macos-x64

      - name: Download VS Code Extension
        uses: actions/download-artifact@v4
        with:
          name: xsharp-vscode-extension

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xsharp-linux-x64.tar.gz
            xsharp-macos-x64.tar.gz
            *.vsix
